<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><title>Momentum, made visible</title><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-140}}
@keyframes twinkle{0%,100%{fill-opacity:1}50%{fill-opacity:.4}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{fill-opacity:.55;stroke-opacity:1}50%{fill-opacity:.2;stroke-opacity:.45}}
@keyframes beam{to{stroke-dashoffset:-900}}
.orbit{animation:orbit 22s linear infinite}
.flow{animation:flow 6s linear infinite}
.twinkle{animation:twinkle 3.6s ease-in-out infinite}
.reveal{animation:reveal .8s ease-out both}
.draw{stroke-dasharray:1;animation:draw 1.35s ease-out both}
.pulse{animation:pulse 4.2s ease-in-out infinite}
.beam{animation:beam 14s linear infinite}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.twinkle,.reveal,.draw,.pulse,.beam{animation:none}.draw{stroke-dasharray:none}}
</style><rect width="1000" height="490" rx="24" fill="#eef3fa"/><rect x="1" y="1" width="998" height="488" rx="23" fill="none" stroke="#779dff" stroke-opacity=".3"/><g font-family="monospace"><text x="40" y="43" fill="#536783" font-size="11" letter-spacing="3">PROFILE SIGNAL</text><text x="40" y="83" fill="#182740" font-size="26">Momentum, made visible</text><text x="48" y="220" fill="#182740" font-size="32">39</text><text x="48" y="255" fill="#536783" font-size="11">REPOSITORIES</text><circle class="pulse" cx="64" cy="320" r="10" fill="#779dff" fill-opacity=".2" stroke="#779dff"/><path class="flow" stroke-dasharray="14 12" d="M90 320h145" stroke="#779dff" stroke-opacity=".25"/><text x="286" y="220" fill="#182740" font-size="32">4</text><text x="286" y="255" fill="#536783" font-size="11">STARS</text><circle class="pulse" cx="302" cy="320" r="10" fill="#779dff" fill-opacity=".2" stroke="#779dff"/><path class="flow" stroke-dasharray="14 12" d="M328 320h145" stroke="#779dff" stroke-opacity=".25"/><text x="524" y="220" fill="#182740" font-size="32">2,005</text><text x="524" y="255" fill="#536783" font-size="11">CONTRIBUTIONS</text><circle class="pulse" cx="540" cy="320" r="10" fill="#779dff" fill-opacity=".2" stroke="#779dff"/><path class="flow" stroke-dasharray="14 12" d="M566 320h145" stroke="#779dff" stroke-opacity=".25"/><text x="762" y="220" fill="#182740" font-size="32">12</text><text x="762" y="255" fill="#536783" font-size="11">FOLLOWERS</text><circle class="pulse" cx="778" cy="320" r="10" fill="#779dff" fill-opacity=".2" stroke="#779dff"/><path class="flow" stroke-dasharray="14 12" d="M804 320h145" stroke="#779dff" stroke-opacity=".25"/><path class="flow" d="M40 112H960" stroke="#779dff" stroke-opacity=".3" stroke-dasharray="8 18" fill="none"/><text x="960" y="472" text-anchor="end" fill="#536783" font-size="9">gitskins.com</text></g></svg>