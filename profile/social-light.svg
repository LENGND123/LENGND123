<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490"><title>Build the next chapter</title><style>
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-140}}
@keyframes twinkle{0%,100%{fill-opacity:1}50%{fill-opacity:.4}}
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{fill-opacity:.55;stroke-opacity:1}50%{fill-opacity:.2;stroke-opacity:.45}}
@keyframes beam{to{stroke-dashoffset:-900}}
.orbit{animation:orbit 22s linear infinite}
.flow{animation:flow 6s linear infinite}
.twinkle{animation:twinkle 3.6s ease-in-out infinite}
.reveal{animation:reveal .8s ease-out both}
.draw{stroke-dasharray:1;animation:draw 1.35s ease-out both}
.pulse{animation:pulse 4.2s ease-in-out infinite}
.beam{animation:beam 14s linear infinite}
@media(prefers-reduced-motion:reduce){.orbit,.flow,.twinkle,.reveal,.draw,.pulse,.beam{animation:none}.draw{stroke-dasharray:none}}
